<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Tracker - Mis Recitales</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    
    <script src="app.js" defer></script>
</head>
<body class="bg-dark text-light">

    <div class="container mt-5">
        <header class="text-center mb-5">
            <h1 class="titulo-principal">🎵 Band Tracker</h1>
            <p class="">Llevá el control de los recitales que viviste</p>
        </header>
        
        <div class="row justify-content-center mb-4">
            <div class="col-md-6 d-flex gap-2">
                <input type="text" id="inputArtista" class="form-control border-secondary" placeholder="Ej: Korn, Slipknot...">
                <button id="btnBuscar" class="btn btn-warning fw-bold px-4">Buscar</button>
                <button id="btnLimpiar" class="btn btn-outline-secondary">Limpiar Filtro</button>
            </div>
        </div>

        <div id="resultados" class="row justify-content-center">
            <div class="col-md-10 text-center text-secondary mt-4">
                Ingresá el artista para comenzar y conocer tu historial.
            </div>
        </div>
    </div>

</body>
</html>
